<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo de Baloncesto - Resultados y Líderes</title>
  <style>
    /* Estilos Generales */
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Títulos */
    h1, h2 {
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Malla de Tarjetas de Líderes */
    .lideres-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .tarjeta-lider {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .badge {
      font-weight: bold;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      display: inline-block;
    }

    .badge-junior { background: #e0e7ff; color: #3730a3; }
    .badge-senior { background: #fef3c7; color: #92400e; }
    .badge-femenino { background: #fce7f3; color: #9d174d; }

    .nombre-jugador {
      font-size: 20px;
      font-weight: bold;
      margin: 16px 0 4px 0;
      color: #1f2937;
    }

    .nombre-equipo {
      color: #6b7280;
      margin: 0 0 16px 0;
      font-size: 14px;
    }

    .puntos-total {
      font-size: 24px;
      font-weight: 800;
    }

    .puntos-junior { color: #2563eb; }
    .puntos-senior { color: #d97706; }
    .puntos-femenino { color: #db2777; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SECCIÓN DE LÍDERES ANOTADORES -->
    <section>
      <h2>Líderes Anotadores</h2>

      <div class="lideres-grid">
        
        <!-- Tarjeta Junior -->
        <div class="tarjeta-lider">
          <span class="badge badge-junior">JUNIOR</span>
          <h3 id="junior-jugador" class="nombre-jugador">Cargando...</h3>
          <p id="junior-equipo" class="nombre-equipo">--</p>
          <div id="junior-puntos" class="puntos-total puntos-junior">0 PTS</div>
        </div>

        <!-- Tarjeta Senior -->
        <div class="tarjeta-lider">
          <span class="badge badge-senior">SENIOR</span>
          <h3 id="senior-jugador" class="nombre-jugador">Cargando...</h3>
          <p id="senior-equipo" class="nombre-equipo">--</p>
          <div id="senior-puntos" class="puntos-total puntos-senior">0 PTS</div>
        </div>

        <!-- Tarjeta Senior Femenino -->
        <div class="tarjeta-lider">
          <span class="badge badge-femenino">SENIOR FEMENINO</span>
          <h3 id="femenino-jugador" class="nombre-jugador">Cargando...</h3>
          <p id="femenino-equipo" class="nombre-equipo">--</p>
          <div id="femenino-puntos" class="puntos-total puntos-femenino">0 PTS</div>
        </div>

      </div>
    </section>

  </div>

  <!-- SCRIPT DE CONEXIÓN CON GOOGLE SHEETS -->
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOublsYbF0dDD0xpIHzZX7uJl1vh5967jPDOwHT2Iw9ECMrqZRNW3PYGkuNqqs71RocsSkPwQThmdH/pub?gid=367038258&single=true&output=csv';

    async function cargarLideresAnotadores() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        
        // Separar por filas
        const filas = data.split('\n').map(row => row.split(','));
        
        // Recorrer filas desde la 1 (saltando encabezados)
        for (let i = 1; i < filas.length; i++) {
          if (!filas[i][0]) continue;
          
          const categoria = filas[i][0].trim().toUpperCase();
          const jugador = filas[i][1] ? filas[i][1].trim() : '--';
          const equipo = filas[i][2] ? filas[i][2].trim() : '--';
          const puntos = filas[i][3] ? filas[i][3].trim() : '0';

          if (categoria === 'JUNIOR') {
            actualizarTarjeta('junior', jugador, equipo, puntos);
          } else if (categoria === 'SENIOR') {
            actualizarTarjeta('senior', jugador, equipo, puntos);
          } else if (categoria.includes('FEMENINO')) {
            actualizarTarjeta('femenino', jugador, equipo, puntos);
          }
        }
      } catch (error) {
        console.error('Error al cargar datos desde Google Sheets:', error);
      }
    }

    function actualizarTarjeta(prefix, jugador, equipo, puntos) {
      const elJugador = document.getElementById(`${prefix}-jugador`);
      const elEquipo = document.getElementById(`${prefix}-equipo`);
      const elPuntos = document.getElementById(`${prefix}-puntos`);

      if (elJugador) elJugador.innerText = jugador;
      if (elEquipo) elEquipo.innerText = equipo;
      if (elPuntos) elPuntos.innerText = `${puntos} PTS`;
    }

    // Ejecutar al abrir la página
    document.addEventListener('DOMContentLoaded', cargarLideresAnotadores);
  </script>

</body>
</html>
